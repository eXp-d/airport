# СПИСОК ТОВАРОВ ДЛЯ СБОРА ЦЕН
#
# Структура:  [категория.группа]
#   name   - любое понятное название (для вас)
#   url    - ссылка на страницу товара на сайте магазина
#   qty    - сколько кг или литров этого товара кладём в корзину
#   amount, unit - ВЕС/ОБЪЁМ упаковки. Необязательно: если не указать,
#                  скрипт возьмёт его из названия товара (например "1700мл").
#                  unit: кг, г, л, мл
#
# ВАЖНО: одна группа = один товар. Название группы (после точки) должно быть
# уникальным: оно станет названием столбца в таблице.

[settings]
store = "Лента"
mrot_rub = 39730        # МРОТ Москвы 2026 (федеральный: 27093)
basket_share = 0.25     # корзина = 1/4 МРОТ
tolerance = 0.05        # допуск +-5%
price_mode = "first"    # если на странице несколько цен: first / min / max

# ---------------------------- Молочные продукты ----------------------------
[dairy.milk]
name = "Молоко пастеризованное ЛЕНТА 3,2%, 1700 мл"
url = "https://lenta.com/product/moloko-lenta-past-32-rossiya-1700ml-475870/"
qty = 6

[dairy.milk_baked]
name = "Молоко топленое АВИДА 3,2%, 900 мл"
url = "https://lenta.com/product/moloko-toplenoe-pitevoe-32-pet-bez-zmzh-rossiya-900ml-657223/"
qty = 2

