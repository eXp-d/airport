# СПИСОК ТОВАРОВ ДЛЯ СБОРА ЦЕН (магазин: Пятёрочка)
#
# Структура:  [категория.группа]
#   name   - любое понятное название (для вас)
#   url    - ссылка на страницу товара на сайте магазина
#   qty    - сколько кг или литров этого товара кладём в корзину
#   amount, unit - ВЕС/ОБЪЁМ упаковки. Необязательно: если не указать,
#                  скрипт возьмёт его из названия товара (например "950мл").
#                  unit: кг, г, л, мл
#
# ВАЖНО:
#  - одна группа = один товар. Название группы (после точки) должно быть
#    уникальным: оно станет названием столбца в таблице;
#  - берите товары, которые "В наличии".

[settings]
store = "Пятёрочка"
start_url = "https://5ka.ru/"   # сайт, который откроет --setup
mrot_rub = 39730        # МРОТ Москвы 2026 (федеральный: 27093)
basket_share = 0.25     # корзина = 1/4 МРОТ
tolerance = 0.05        # допуск +-5%
price_mode = "first"    # если на странице несколько цен: first / min / max

# ---------------------------- Молочные продукты ----------------------------
[dairy.milk]
name = "Молоко Село Зелёное пастеризованное 3,2% БЗМЖ"
url = "https://5ka.ru/product/moloko-selo-zelenoe-pasterizovannoe-3-2-bzmzh-1-94--3425329/"
qty = 6
# Если скрипт напишет "не нашёл вес/объём в названии", раскомментируйте
# две строки ниже и впишите объём упаковки с карточки товара:
# amount = 0.95
# unit = "л"

# ---------------------------- Мясо и птица ----------------------------
[meat.chicken]
name = "Филе грудки цыплёнка Петелинка охлаждённое"
url = "https://5ka.ru/product/file-grudki-tsyplyonka-petelinka-okhlazhdyonnoe--2173555/"
qty = 3
amount = 1      # смотрите ниже, это важно
unit = "кг"

# ---------------------------- Крупы ----------------------------
[cereals.rice]
name = "Рис Global Village Басмати шлифованный 450г"
url = "https://5ka.ru/product/ris-global-village-basmati-shlifovannyy-450g--4089968/"
qty = 2
amount = 0.45
unit = "кг"